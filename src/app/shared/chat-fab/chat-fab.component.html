<div class="fab fixed bottom-4 right-4 z-40 sm:bottom-6 sm:right-6" [class.is-visible]="splash.done()" [class.hint-open]="hint()">

    <!-- Mensaje: aparece solo unos segundos después de cargar la página, se queda visible y también se ve al pasar el mouse o enfocar el botón.
         En móvil es una pastilla corta ("¿Hablamos?") junto al robot; desde sm se muestra la frase completa. -->
    <span class="fab-label pointer-events-none absolute right-full top-1/2 mr-8 w-max rounded-xl bg-[#080911] px-3.5 py-2 text-sm font-semibold text-white shadow-[0_12px_35px_rgba(8,9,17,0.35)] ring-1 ring-white/10 sm:mr-9 sm:px-4 sm:py-2.5" aria-hidden="true">
        ¿Hablamos?<span class="hidden text-[#00F2FE] sm:inline">&nbsp;{{ whatsapp ? 'Escríbenos por WhatsApp' : 'Agenda una reunión' }}</span>
    </span>

    <a [attr.href]="whatsapp || null" [attr.target]="whatsapp ? '_blank' : null" [attr.rel]="whatsapp ? 'noopener noreferrer' : null" role="link" tabindex="0"
        (click)="onClick($event)" [attr.aria-label]="whatsapp ? 'Escribir por WhatsApp a GrowthProject AI' : 'Agendar una reunión con GrowthProject AI'"
        class="fab-button group relative block hover:cursor-pointer">

        <!-- Aro que late despacio -->
        <span class="fab-ring absolute inset-0 rounded-full" aria-hidden="true"></span>

        <!-- Círculo (la burbuja) con el robot dentro -->
        <span class="fab-bubble relative block h-full w-full overflow-hidden rounded-full bg-gradient-to-br from-[#6C5CE7] via-[#6C8CFF] to-[#00F2FE] p-[3px] shadow-[0_14px_35px_rgba(108,92,231,0.45)] transition duration-300 group-hover:shadow-[0_18px_44px_rgba(0,242,254,0.35)]">
            <span class="relative block h-full w-full overflow-hidden rounded-full bg-[#150c3d]">
                <img src="/branding/robot-chat-full-240.webp" alt="" aria-hidden="true" width="240" height="229" decoding="async"
                    class="fab-robot absolute max-w-none" />
            </span>
        </span>

        <!-- Mismo robot, recortado para que solo asome lo que sale de la burbuja: la mano que saluda y la antena -->
        <span class="fab-pop pointer-events-none absolute inset-0" aria-hidden="true">
            <img src="/branding/robot-chat-full-240.webp" alt="" width="240" height="229" decoding="async"
                class="fab-robot fab-robot-pop absolute max-w-none" />
        </span>

        <!-- Punto verde de «en línea» -->
        <span class="absolute bottom-0.5 right-0.5 h-3.5 w-3.5 rounded-full border-2 border-white bg-[#19e3a1]" aria-hidden="true"></span>
    </a>

</div>
