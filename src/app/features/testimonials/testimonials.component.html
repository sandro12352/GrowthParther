@if (items.length) {
<section class="relative overflow-hidden bg-white py-24 lg:py-32">

    <div class="pointer-events-none absolute -left-40 top-1/4 h-[380px] w-[380px] rounded-full bg-[#6C5CE7]/10 blur-[120px]"></div>
    <div class="pointer-events-none absolute -right-40 bottom-0 h-[380px] w-[380px] rounded-full bg-[#00F2FE]/10 blur-[120px]"></div>

    <div class="relative mx-auto px-6 lg:max-w-[80vw] lg:px-8">

        <div appReveal revealStagger class="mx-auto max-w-3xl text-center">
            <span class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-[#5b49d6]">
                <span class="h-1.5 w-1.5 rounded-full bg-[#6C5CE7]"></span>
                Testimonios
            </span>
            <h2 class="mt-5 text-3xl font-bold leading-[1.1] tracking-tight text-[#080911] md:text-5xl">
                Lo que dicen quienes
                <span class="bg-gradient-to-r from-[#6C5CE7] to-[#00b8c4] bg-clip-text text-transparent">ya automatizan</span>
            </h2>
        </div>

        <!-- Tarjetas: se centran con cualquier cantidad (1, 2, 3 o más) -->
        <ul appReveal revealStagger class="mt-10 flex flex-wrap justify-center gap-6">
            @for (t of items; track t.name; let i = $index) {
            <li class="flex w-full md:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)]">
                <figure class="relative flex w-full flex-col overflow-hidden rounded-3xl border border-black/10 bg-white p-7 shadow-[0_10px_30px_rgba(8,9,17,0.05)] transition duration-300 hover:-translate-y-1 hover:border-[#6C5CE7]/30 hover:shadow-[0_25px_60px_rgba(108,92,231,0.15)]">

                    <div class="flex items-center gap-4">
                        @if (t.photo) {
                        <span class="h-20 w-20 shrink-0 overflow-hidden rounded-full bg-gradient-to-br from-[#6C5CE7]/30 via-[#6C8CFF]/25 to-[#00F2FE]/40 shadow-md ring-2 ring-white">
                            <img [src]="t.photo" [alt]="'Foto de ' + t.name" width="160" height="160" loading="lazy" decoding="async"
                                class="h-full w-full object-cover" />
                        </span>
                        } @else {
                        <span aria-hidden="true"
                            class="flex h-20 w-20 shrink-0 items-center justify-center rounded-full text-xl font-bold text-white shadow-md"
                            [class]="i % 2 === 0 ? 'bg-gradient-to-br from-[#6C5CE7] to-[#6C8CFF]' : 'bg-gradient-to-br from-[#6C8CFF] to-[#00b8c4]'">{{ initials(t.name) }}</span>
                        }
                        <div class="min-w-0">
                            <p class="font-bold text-[#080911]">{{ t.name }}</p>
                            <p class="text-sm leading-5 text-black/60">{{ t.role }} · {{ t.business }}</p>
                            @if (t.city) {
                            <p class="text-sm leading-5 text-black/45">{{ t.city }}</p>
                            }
                        </div>
                    </div>

                    @if (t.rating; as rating) {
                    <span class="mt-5 flex gap-0.5" role="img" [attr.aria-label]="rating + ' de 5 estrellas'">
                        @for (n of starSlots; track n) {
                        <svg viewBox="0 0 24 24" class="h-5 w-5" [class]="n <= rating ? 'fill-[#F5A623] text-[#F5A623]' : 'fill-transparent text-black/20'" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9L12 2.8z" />
                        </svg>
                        }
                    </span>
                    }

                    <blockquote class="mt-4 flex-1 text-base leading-7 text-black/75">
                        {{ t.quote }}
                    </blockquote>

                </figure>
            </li>
            }
        </ul>

    </div>
</section>
}
