<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GrowthProject AI | Automatización e Inteligencia Artificial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(sessionStorage.getItem("shinkia-splash"))document.documentElement.classList.add("no-splash")}catch(e){}</script>
  <meta name="description" content="GrowthProject AI conecta tus herramientas y automatiza los procesos de tu empresa con inteligencia artificial.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <!-- Red de seguridad del splash: la entrada la lanza el componente cuando Angular ya arrancó (así no se pierde el inicio
       del desvanecido); si por algún motivo no lo hiciera, se lanza sola a los 2,5 s. -->
  <script>setTimeout(function(){var d=document.documentElement;if(!d.classList.contains("no-splash")&&!d.classList.contains("splash-go")){window.__splashGo=performance.now();d.classList.add("splash-go")}},2500)</script>
</body>
</html>
